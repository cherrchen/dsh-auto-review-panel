name: CI

on:
  # Reusable-verify entry point for release.yml: the tag build must pass the
  # same gates (lint, typecheck, build, tests, smokes, docs) as main.
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  releases:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.contract.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - id: contract
        run: echo "versions=$(node scripts/list-dsh-releases.mjs)" >> "$GITHUB_OUTPUT"

  verify:
    needs: releases
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.releases.outputs.versions) }}
        # `DSH_WINDOWS_CI=1` adds the Windows lane. It is parked by default:
        # enable the repository variable when the panel grows
        # platform-dependent behavior that needs Windows evidence.
        os: ${{ fromJSON(vars.DSH_WINDOWS_CI == '1' && '["ubuntu-latest","ubuntu-22.04","macos-latest","windows-latest"]' || '["ubuntu-latest","ubuntu-22.04","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Readable, non-interactive failures: no TTY to wrap, no spinner rewrites.
      CI: 'true'
      FORCE_COLOR: '0'
      TERM: dumb
      DSH_MATRIX_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install the exact matrix release
        run: |
          pin=$(node -p "require('./package.json').devDependencies['@deepseek-ai/dsh']")
          if [ "$DSH_MATRIX_VERSION" = "$pin" ]; then
            pnpm install --frozen-lockfile
          else
            node scripts/upgrade-dsh.mjs "$DSH_MATRIX_VERSION"
            # The repointed tree resolves the newest upstream builds by design.
            # pnpm re-verifies lockfile package ages inside `install` itself and
            # again before every `pnpm run`, reading THIS file — so the intended
            # bypass lives in config, not a one-shot CLI flag. This checkout is
            # throwaway; nothing lands back in the repository.
            echo 'minimumReleaseAge: 0' >> pnpm-workspace.yaml
            pnpm install --no-frozen-lockfile
          fi
        shell: bash
      # Before anything else: the allowlist, peerDependencies, the development
      # pin and the installed tree must agree. Every later step's result is only
      # meaningful as evidence for a release the contract actually claims, so a
      # drifted manifest is reported here rather than as a confusing test
      # failure. See docs/decisions/ADR-0001-dsh-compat-contract.md.
      - name: DSH compatibility contract
        run: pnpm compat:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck both faces
        run: pnpm typecheck
      # Build BEFORE the tests: `tests/client-bundle.spec.ts` asserts the BUILT
      # browser artifact, and `lib/` is not in Git (see .gitignore), so a clean
      # checkout has nothing to assert until this step has run.
      - name: Build the package (before the tests that read lib/)
        run: pnpm build

      # The test log is captured as well as streamed, and uploaded when the step
      # fails. A red run has to be diagnosable from the run page alone — an
      # unreproducible failure with no log is a failure nobody can fix.
      - name: Run the unit suite
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee vitest.log
        shell: bash
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log-${{ matrix.os }}-${{ matrix.dsh }}
          path: |
            vitest.log
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Composition gate
        run: |
          set -o pipefail
          pnpm smoke:compose 2>&1 | tee smoke-compose.log
        shell: bash

      # The packed artifact is what a release ships; prove its completeness and
      # run the composition smoke against the INSTALLED tarball on every OS.
      - name: Packed artifact verification
        run: pnpm pack:check
      - name: Packed smoke
        # Includes installation and parent cleanup. A hung child or native
        # filesystem operation must still leave time to upload logs.
        timeout-minutes: 15
        run: |
          set -o pipefail
          pnpm smoke:packed 2>&1 | tee smoke-packed.log
        shell: bash

      - name: Upload the smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.os }}-${{ matrix.dsh }}
          path: |
            smoke-compose.log
            smoke-packed.log
          if-no-files-found: ignore
          retention-days: 7

      - run: pnpm docs:check

  # The result the reusable workflow hands a caller: a skipped or cancelled
  # matrix must never read as green, so `publish` in release.yml sees a failed
  # verify unless BOTH upstream jobs ended in exactly `success`.
  gate:
    needs: [releases, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require exact success upstream
        run: |
          releases="${{ needs.releases.result }}"
          verify="${{ needs.verify.result }}"
          echo "releases=${releases} verify=${verify}"
          if [ "$releases" != "success" ] || [ "$verify" != "success" ]; then
            echo "::error::CI gate failed: releases=${releases} verify=${verify} (both must be exactly 'success')"
            exit 1
          fi
