# Auto Review Panel bundle: mount the compatibility gate, the panel's host
# half, and the bare-name client-graph anchor.
#
# This plugin widens nothing on its own: it gives the Auto permission
# preset's reviewer a visible surface. Every row that consumes a widened
# surface injects `autoReviewPanelCompat`, so a harness whose DSH release is
# not on this plugin's allowlist degrades to "plugin not installed" instead of
# running a review surface on an unverified shape.
#
# The last row is the client-graph anchor: the web client-module scan reads a
# package's `dsh.client` declaration only from a loader row mounted at the
# bare package name (subpath rows are never client rows), so this no-op
# carrier row is what gets `lib/client.js` served to the browser.
- insert:
    # The compatibility gate comes first, and every widened-authority row
    # below injects `autoReviewPanelCompat`. If the installed DSH release is
    # not on this plugin's allowlist, this row throws and none of them start.
    - id: auto-review-panel-compat
      name: '@dsh-electron/dsh-auto-review-panel/compat'
    # The panel's host half: registers the review-surface channel wherever a
    # host Connection exists — a headless profile mounts it with no visible
    # effect.
    - id: auto-review-panel
      name: '@dsh-electron/dsh-auto-review-panel/panel'
    # The client-graph anchor: mounted at the bare package name so the web
    # client-module scan reads this package's `dsh.client` declaration.
    - id: auto-review-panel-client
      name: '@dsh-electron/dsh-auto-review-panel'
